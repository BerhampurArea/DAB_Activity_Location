<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's DAB Activity Map</title>
<style>
  :root{
    --navy:#0B1F3A;
    --navy-light:#122C52;
    --blue:#0B63CE;
    --blue-light:#E8F1FC;
    --green:#178A5A;
    --line:#DCE1E8;
    --bg:#F4F6F9;
    --white:#FFFFFF;
    --ink:#1A2233;
    --muted:#5B6472;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);
    color:#fff;
    padding:20px 16px 22px;
  }
  header .eyebrow{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:#9FC1F2;font-weight:600;margin-bottom:6px;
  }
  header h1{margin:0;font-size:21px;}
  header p{margin:6px 0 0;font-size:13px;color:#C3D5EF;}
  .toolbar{
    display:flex;gap:8px;padding:14px 16px 0;max-width:640px;margin:0 auto;
    flex-wrap:wrap;
  }
  .toolbar button{
    flex:1;min-width:130px;
    padding:11px;border-radius:9px;border:1.5px solid var(--line);
    background:var(--white);font-size:13.5px;font-weight:700;color:var(--navy);
    cursor:pointer;
  }
  .toolbar button.primary{
    background:var(--navy);color:#fff;border-color:var(--navy);
  }
  main{max-width:640px;margin:0 auto;padding:14px 16px 40px;}
  .filters{
    display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap;align-items:center;
  }
  .filters label{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:700;width:100%;margin-bottom:2px;
  }
  .date-input{
    padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;
    font-size:14px;font-family:inherit;background:var(--white);color:var(--ink);
    width:100%;
  }
  .summary{display:flex;gap:10px;margin:16px 0;}
  .summary .stat{
    flex:1;background:var(--white);border:1px solid var(--line);
    border-radius:10px;padding:12px;text-align:center;
  }
  .summary .stat .num{font-size:20px;font-weight:800;color:var(--navy);}
  .summary .stat .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
  .territory-group{margin-bottom:18px;}
  .territory-title{
    font-size:13px;font-weight:800;color:var(--blue);
    text-transform:uppercase;letter-spacing:.06em;
    margin-bottom:8px;padding-left:2px;
  }
  .dab-card{
    background:var(--white);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:10px;
  }
  .dab-card.selected{
    border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-light);
  }
  .select-chk{
    display:flex;align-items:center;gap:8px;
    font-size:12.5px;font-weight:700;color:var(--muted);
    padding-bottom:10px;margin-bottom:10px;
    border-bottom:1px dashed var(--line);
    cursor:pointer;user-select:none;
  }
  .select-chk input{width:17px;height:17px;accent-color:var(--blue);cursor:pointer;flex-shrink:0;}
  .select-chk.selected{color:var(--blue);}
  .dab-card .name-row{
    display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
    margin-bottom:10px;
  }
  .dab-card .name{font-size:16px;font-weight:800;color:var(--navy);}
  .dab-card .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .dab-card .type-badge{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:var(--blue-light);color:var(--blue);white-space:nowrap;
    flex-shrink:0;
  }
  .info-row{
    display:flex;align-items:center;gap:10px;
    font-size:14px;padding:7px 0;
  }
  .info-row .icon{width:20px;text-align:center;flex-shrink:0;}
  .info-row .val{font-weight:600;}
  .info-row a{color:var(--blue);text-decoration:none;font-weight:700;}
  .map-btn{
    display:block;text-align:center;margin-top:12px;
    padding:12px;border-radius:9px;
    background:var(--blue);color:#fff;
    font-size:14px;font-weight:700;text-decoration:none;
  }
  .map-btn:active{opacity:.85;}
  .location-row{
    display:flex;gap:10px;margin-top:12px;align-items:stretch;
  }
  .location-row .map-btn{margin-top:0;flex:1;display:flex;align-items:center;justify-content:center;}
  .location-photo{
    width:64px;height:64px;flex-shrink:0;border-radius:9px;overflow:hidden;
    border:1.5px solid var(--line);
  }
  .location-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .empty{
    text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;
  }
  .loading{text-align:center;padding:40px;color:var(--muted);}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Berhampur Area · Live</div>
  <h1>Today's DAB Activity Map</h1>
  <p id="dateLine">Loading…</p>
</header>

<div class="toolbar">
  <button class="primary" id="copyBtn" onclick="copyWhatsAppText()">📋 Copy Selected (0)</button>
  <button onclick="loadData()">🔄 Refresh</button>
</div>

<main>
  <div class="filters">
    <label>Date</label>
    <input type="date" id="dateFilter" class="date-input">
  </div>
  <div class="filters">
    <label>JC Name</label>
    <select id="jcNameFilter" class="date-input">
      <option value="">All JC Names</option>
      <option value="OR-PURI-JC-01">OR-PURI-JC-01</option>
      <option value="OR-PRDP-JC-01">OR-PRDP-JC-01</option>
      <option value="OR-KNDP-JC-01">OR-KNDP-JC-01</option>
      <option value="OR-BJJG-JC-01">OR-BJJG-JC-01</option>
      <option value="OR-BLGR-JC-01">OR-BLGR-JC-01</option>
      <option value="OR-JRGD-JC-01">OR-JRGD-JC-01</option>
      <option value="OR-BDRK-JC-01">OR-BDRK-JC-01</option>
      <option value="OR-KURD-JC-01">OR-KURD-JC-01</option>
      <option value="OR-BRPD-JC-01">OR-BRPD-JC-01</option>
      <option value="OR-BRBL-JC-01">OR-BRBL-JC-01</option>
      <option value="OR-CCKK-JC-01">OR-CCKK-JC-01</option>
      <option value="OR-JGPT-JC-01">OR-JGPT-JC-01</option>
      <option value="OR-DKLL-JC-01">OR-DKLL-JC-01</option>
      <option value="OR-SMBP-JC-01">OR-SMBP-JC-01</option>
      <option value="OR-NLCO-JC-01">OR-NLCO-JC-01</option>
      <option value="OR-RGNP-JC-01">OR-RGNP-JC-01</option>
      <option value="OR-BRAH-JC-01">OR-BRAH-JC-01</option>
      <option value="OR-JTNI-JC-01">OR-JTNI-JC-01</option>
      <option value="OR-BLSR-JC-01">OR-BLSR-JC-01</option>
      <option value="OR-JYPR-JC-01">OR-JYPR-JC-01</option>
      <option value="OR-BBSR-JC-01">OR-BBSR-JC-01</option>
      <option value="OR-TLCH-JC-01">OR-TLCH-JC-01</option>
      <option value="OR-SUNA-JC-01">OR-SUNA-JC-01</option>
      <option value="OR-BBSR-JC-02">OR-BBSR-JC-02</option>
      <option value="OR-SNBD-JC-01">OR-SNBD-JC-01</option>
      <option value="OR-KDJR-JC-01">OR-KDJR-JC-01</option>
      <option value="OR-RYGD-JC-01">OR-RYGD-JC-01</option>
      <option value="OR-RRKL-JC-01">OR-RRKL-JC-01</option>
      <option value="OR-BLPH-JC-01">OR-BLPH-JC-01</option>
      <option value="OR-BGRH-JC-01">OR-BGRH-JC-01</option>
      <option value="OR-BNPN-JC-01">OR-BNPN-JC-01</option>
    </select>
  </div>

  <div class="summary">
    <div class="stat"><div class="num" id="statCount">–</div><div class="label" id="statLabel">Active Today</div></div>
    <div class="stat"><div class="num" id="statTerritories">–</div><div class="label">JC Names</div></div>
  </div>
  <div id="content" class="loading">Loading DAB locations…</div>
</main>

<script>
  // TODO: paste your deployed Apps Script Web App URL here (same as index.html)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcFejoFjqykdmz3Bwoa0ZNblDAV6UkvFy9939mK74SDzb74qIsFCU8FnoJItiZR5MN0g/exec";

  let latestData = [];
  let selectedKeys = new Set();

  const dateFilterEl = document.getElementById("dateFilter");
  const jcNameFilterEl = document.getElementById("jcNameFilter");
  const todayISO = new Date().toISOString().slice(0, 10);
  dateFilterEl.value = todayISO;
  dateFilterEl.addEventListener("change", loadData);
  jcNameFilterEl.addEventListener("change", loadData);

  function toggleSelect(key){
    if(selectedKeys.has(key)) selectedKeys.delete(key);
    else selectedKeys.add(key);
    render(latestData, dateFilterEl.value || todayISO);
  }

  function loadData(){
    document.getElementById("content").innerHTML = '<div class="loading">Loading DAB locations…</div>';
    const selectedDate = dateFilterEl.value || todayISO;
    const selectedJcName = jcNameFilterEl.value;
    let url = SCRIPT_URL + "?date=" + encodeURIComponent(selectedDate);
    if(selectedJcName) url += "&jcName=" + encodeURIComponent(selectedJcName);

    fetch(url)
      .then(r => r.json())
      .then(res => {
        if(res.status === "error"){
          console.error("Apps Script error:", res.message);
          document.getElementById("content").innerHTML =
            '<div class="empty">Script error: ' + escapeHtml(res.message || "unknown") +
            '<br><small>Check the Apps Script SCRIPT_URL is correct and redeployed.</small></div>';
          return;
        }
        latestData = res.data || [];
        render(latestData, selectedDate);
      })
      .catch(err => {
        console.error("Fetch failed:", err);
        document.getElementById("content").innerHTML =
          '<div class="empty">Could not load data. Check connection, or that SCRIPT_URL in this file is your correct deployed Apps Script /exec link.</div>';
      });
  }

  // Builds a reliable Google Maps link. Prefers GPS coordinates (most
  // accurate); falls back to the typed address + pin code only when no
  // coordinates were captured. Uses the universal maps query format,
  // which opens correctly in both the Google Maps app and browser.
  function buildMapsLink(d){
    const lat = String(d["Latitude"] || "").trim();
    const lng = String(d["Longitude"] || "").trim();
    if(lat && lng && !isNaN(parseFloat(lat)) && !isNaN(parseFloat(lng))){
      return "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(lat + "," + lng);
    }
    const addressQuery = [d["Address"], d["Pin Code"]].filter(Boolean).join(", ");
    return "https://www.google.com/maps/search/?api=1&query=" +
      encodeURIComponent(addressQuery || "Odisha");
  }

  function render(data, selectedDate){
    const dateLine = document.getElementById("dateLine");
    const dateObj = new Date(selectedDate + "T00:00:00");
    const isToday = selectedDate === todayISO;
    dateLine.textContent = (isToday ? "Today · " : "") +
      dateObj.toLocaleDateString("en-IN", { weekday:"long", day:"numeric", month:"long" });
    document.getElementById("statLabel").textContent = isToday ? "Active Today" : "Active";

    document.getElementById("statCount").textContent = data.length;
    const copyBtn = document.getElementById("copyBtn");
    if(copyBtn){
      const selCount = data.filter(d => selectedKeys.has(String(d["Timestamp"]))).length;
      copyBtn.textContent = "📋 Copy Selected (" + selCount + ")";
    }

    const jcNames = new Set(data.map(d => d["JC Name"]));
    document.getElementById("statTerritories").textContent = jcNames.size;

    const content = document.getElementById("content");
    if(data.length === 0){
      content.innerHTML = '<div class="empty">No DAB activity locations found for this date.</div>';
      return;
    }

    const grouped = {};
    data.forEach(d => {
      const t = d["JC Name"] || "Unassigned";
      if(!grouped[t]) grouped[t] = [];
      grouped[t].push(d);
    });

    let html = "";
    Object.keys(grouped).sort().forEach(t => {
      html += `<div class="territory-group"><div class="territory-title">${t}</div>`;
      grouped[t].forEach(d => {
        const mapsLink = buildMapsLink(d);
        const key = String(d["Timestamp"]);
        const isSelected = selectedKeys.has(key);
        html += `
          <div class="dab-card${isSelected ? " selected" : ""}">
            <label class="select-chk${isSelected ? " selected" : ""}">
              <input type="checkbox" ${isSelected ? "checked" : ""} onchange="toggleSelect('${key.replace(/'/g,"\\'")}')">
              ${isSelected ? "Selected for broadcast" : "Select for broadcast"}
            </label>
            <div class="name-row">
              <div>
                <div class="name">${escapeHtml(d["DAB Name"])}</div>
                <div class="sub">${escapeHtml(d["JioPoint Name"] || "")}</div>
              </div>
              <div class="type-badge">${escapeHtml(d["Activity Type"] || "")}</div>
            </div>
            <div class="info-row">
              <span class="icon">🏷️</span>
              <span class="val">${escapeHtml(d["JC Name"] || "—")}</span>
            </div>
            <div class="info-row">
              <span class="icon">📞</span>
              <a href="tel:${escapeHtml(d["DAB Mobile Number"])}">${escapeHtml(d["DAB Mobile Number"])}</a>
            </div>
            <div class="info-row">
              <span class="icon">🕐</span>
              <span class="val">${to12Hour(d["Time From"])} – ${to12Hour(d["Time To"])}</span>
            </div>
            <div class="location-row">
              <a class="map-btn" href="${mapsLink}" target="_blank">📍 Open Location in Maps</a>
              ${d["Photo URL"] ? `<a class="location-photo" href="${d["Photo URL"]}" target="_blank"><img src="${d["Photo URL"]}" alt="Activity location photo"></a>` : ""}
            </div>
          </div>`;
      });
      html += `</div>`;
    });

    content.innerHTML = html;
  }

  function escapeHtml(str){
    if(!str) return "";
    return String(str).replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  function to12Hour(timeStr){
    if(!timeStr) return "";
    const parts = String(timeStr).split(":");
    if(parts.length < 2) return timeStr;
    let hours = parseInt(parts[0], 10);
    const minutes = parts[1].padStart(2, "0");
    if(isNaN(hours)) return timeStr;
    const suffix = hours >= 12 ? "PM" : "AM";
    hours = hours % 12;
    if(hours === 0) hours = 12;
    return hours + ":" + minutes + " " + suffix;
  }

  function copyWhatsAppText(){
    const selected = latestData.filter(d => selectedKeys.has(String(d["Timestamp"])));
    if(selected.length === 0){
      alert("Select at least one activity (tick 'Select for broadcast' on the entries you want) before copying.");
      return;
    }

    const blocks = selected.map(d => {
      const mapsLink = buildMapsLink(d);
      return `📢 Special Jio Offer – Visit Our Activity Location! 📍
Get your Jio SIM Activation and Best Offer on the Spot! 🎁📱
👉 Please visit the Activity Location as per the details below, or contact our representative for assistance.
👤 Representative Name: ${d["DAB Name"]}
📞 Mobile Number: ${d["DAB Mobile Number"]}
📍 Location: ${mapsLink}
⏰ Time: ${to12Hour(d["Time From"])} – ${to12Hour(d["Time To"])}
🔥 Visit the location today and get the best offer on the spot!
Jio — Better Experience, Better Value. 💙`;
    });

    const text = blocks.join("\n\n———\n\n");

    navigator.clipboard.writeText(text).then(() => {
      alert("Broadcast text copied — paste directly into the JCA-ACT WhatsApp group.");
    }).catch(() => {
      prompt("Copy this text manually:", text);
    });
  }

  loadData();
</script>

</body>
</html>
