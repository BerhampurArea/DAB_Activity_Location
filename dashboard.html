<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's DAB Activity Map</title>
<style>
  :root{
    --navy:#0B1F3A;
    --navy-light:#122C52;
    --blue:#0B63CE;
    --blue-light:#E8F1FC;
    --green:#178A5A;
    --line:#DCE1E8;
    --bg:#F4F6F9;
    --white:#FFFFFF;
    --ink:#1A2233;
    --muted:#5B6472;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);
    color:#fff;
    padding:20px 16px 22px;
  }
  header .eyebrow{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:#9FC1F2;font-weight:600;margin-bottom:6px;
  }
  header h1{margin:0;font-size:21px;}
  header p{margin:6px 0 0;font-size:13px;color:#C3D5EF;}
  .toolbar{
    display:flex;gap:8px;padding:14px 16px 0;max-width:640px;margin:0 auto;
    flex-wrap:wrap;
  }
  .toolbar button{
    flex:1;min-width:130px;
    padding:11px;border-radius:9px;border:1.5px solid var(--line);
    background:var(--white);font-size:13.5px;font-weight:700;color:var(--navy);
    cursor:pointer;
  }
  .toolbar button.primary{
    background:var(--navy);color:#fff;border-color:var(--navy);
  }
  main{max-width:640px;margin:0 auto;padding:14px 16px 40px;}
  .filters{
    display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap;align-items:center;
  }
  .filters label{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:700;width:100%;margin-bottom:2px;
  }
  .date-input{
    padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;
    font-size:14px;font-family:inherit;background:var(--white);color:var(--ink);
  }
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);
    background:var(--white);font-size:12.5px;font-weight:700;color:var(--muted);
    cursor:pointer;white-space:nowrap;
  }
  .chip.active{
    background:var(--blue);border-color:var(--blue);color:#fff;
  }
  .summary{
    display:flex;gap:10px;margin-bottom:16px;
  }
  .summary .stat{
    flex:1;background:var(--white);border:1px solid var(--line);
    border-radius:10px;padding:12px;text-align:center;
  }
  .summary .stat .num{font-size:20px;font-weight:800;color:var(--navy);}
  .summary .stat .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
  .territory-group{margin-bottom:18px;}
  .territory-title{
    font-size:13px;font-weight:800;color:var(--blue);
    text-transform:uppercase;letter-spacing:.06em;
    margin-bottom:8px;padding-left:2px;
  }
  .dab-card{
    background:var(--white);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:10px;
  }
  .dab-card.selected{
    border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-light);
  }
  .select-chk{
    display:flex;align-items:center;gap:8px;
    font-size:12.5px;font-weight:700;color:var(--muted);
    padding:9px 4px;cursor:pointer;user-select:none;
  }
  .select-chk input{width:17px;height:17px;accent-color:var(--blue);cursor:pointer;}
  .select-chk.selected{color:var(--blue);}
  .dab-card .top-row{
    display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
    margin-bottom:8px;
  }
  .dab-card .name{font-size:15px;font-weight:700;}
  .dab-card .type-badge{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:var(--blue-light);color:var(--blue);white-space:nowrap;
  }
  .dab-card .meta{font-size:13px;color:var(--muted);line-height:1.6;}
  .dab-card .meta b{color:var(--ink);}
  .dab-card .actions{margin-top:10px;display:flex;gap:8px;}
  .dab-card .actions a{
    flex:1;text-align:center;padding:9px;border-radius:8px;
    font-size:12.5px;font-weight:700;text-decoration:none;
    border:1.5px solid var(--line);color:var(--navy);
  }
  .dab-card .actions a.map{background:var(--blue-light);color:var(--blue);border-color:var(--blue-light);}
  .empty{
    text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;
  }
  .loading{text-align:center;padding:40px;color:var(--muted);}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Berhampur Area · Live</div>
  <h1>Today's DAB Activity Map</h1>
  <p id="dateLine">Loading…</p>
</header>

<div class="toolbar">
  <button class="primary" id="copyBtn" onclick="copyWhatsAppText()">📋 Copy Selected (0)</button>
  <button onclick="loadData()">🔄 Refresh</button>
</div>

<main>
  <div class="filters">
    <label>Date</label>
    <input type="date" id="dateFilter" class="date-input">
  </div>
  <div class="filters">
    <label>Activity Type</label>
    <div class="chip-row" id="activityChips">
      <div class="chip active" data-type="">All</div>
      <div class="chip" data-type="Shamiyana">Shamiyana</div>
      <div class="chip" data-type="Gazebo">Gazebo</div>
      <div class="chip" data-type="Umbrella">Umbrella</div>
    </div>
  </div>

  <div class="summary" style="margin-top:16px;">
    <div class="stat"><div class="num" id="statCount">–</div><div class="label" id="statLabel">Active</div></div>
    <div class="stat"><div class="num" id="statTerritories">–</div><div class="label">Territories</div></div>
  </div>
  <div id="content" class="loading">Loading DAB locations…</div>
</main>

<script>
  // TODO: paste your deployed Apps Script Web App URL here (same as index.html)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcFejoFjqykdmz3Bwoa0ZNblDAV6UkvFy9939mK74SDzb74qIsFCU8FnoJItiZR5MN0g/exec";

  const TERRITORY_NAMES = {
    BRAH: "Berhampur",
    BNPN: "Bhawanipatna",
    JYPR: "Jeypore",
    RYGD: "Rayagada",
    SNBD: "Sunabeda",
    BLGR: "Balangir",
    KURD: "Khurdha",
    JTNI: "Jatani"
  };

  let latestData = [];
  let selectedActivityType = "";
  let selectedKeys = new Set();

  function toggleSelect(key){
    if(selectedKeys.has(key)) selectedKeys.delete(key);
    else selectedKeys.add(key);
    render(latestData, dateFilterEl.value || todayISO);
  }

  const dateFilterEl = document.getElementById("dateFilter");
  const todayISO = new Date().toISOString().slice(0, 10);
  dateFilterEl.value = todayISO;
  dateFilterEl.addEventListener("change", loadData);

  document.getElementById("activityChips").addEventListener("click", function(e){
    const chip = e.target.closest(".chip");
    if(!chip) return;
    document.querySelectorAll("#activityChips .chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    selectedActivityType = chip.dataset.type || "";
    loadData();
  });

  function loadData(){
    document.getElementById("content").innerHTML = '<div class="loading">Loading DAB locations…</div>';
    const selectedDate = dateFilterEl.value || todayISO;
    let url = SCRIPT_URL + "?date=" + encodeURIComponent(selectedDate);
    if(selectedActivityType) url += "&activityType=" + encodeURIComponent(selectedActivityType);

    fetch(url)
      .then(r => r.json())
      .then(res => {
        latestData = res.data || [];
        render(latestData, selectedDate);
      })
      .catch(() => {
        document.getElementById("content").innerHTML =
          '<div class="empty">Could not load data. Check connection or the Apps Script URL.</div>';
      });
  }

  function render(data, selectedDate){
    const dateLine = document.getElementById("dateLine");
    const dateObj = new Date(selectedDate + "T00:00:00");
    const isToday = selectedDate === todayISO;
    dateLine.textContent = (isToday ? "Today · " : "") +
      dateObj.toLocaleDateString("en-IN", { weekday:"long", day:"numeric", month:"long" });
    document.getElementById("statLabel").textContent = isToday ? "Active Today" : "Active";

    document.getElementById("statCount").textContent = data.length;
    const copyBtn = document.getElementById("copyBtn");
    if(copyBtn){
      const selCount = data.filter(d => selectedKeys.has(String(d["Timestamp"]))).length;
      copyBtn.textContent = "📋 Copy Selected (" + selCount + ")";
    }
    const territories = new Set(data.map(d => d["Territory"]));
    document.getElementById("statTerritories").textContent = territories.size;

    const content = document.getElementById("content");
    if(data.length === 0){
      content.innerHTML = '<div class="empty">No DAB activity locations found for this date' +
        (selectedActivityType ? " and activity type" : "") + '.</div>';
      return;
    }

    const grouped = {};
    data.forEach(d => {
      const t = d["Territory"] || "Unassigned";
      if(!grouped[t]) grouped[t] = [];
      grouped[t].push(d);
    });

    let html = "";
    Object.keys(grouped).sort().forEach(t => {
      const label = TERRITORY_NAMES[t] || t;
      html += `<div class="territory-group"><div class="territory-title">${label} (${t})</div>`;
      grouped[t].forEach(d => {
        const mapsLink = d["Latitude"] && d["Longitude"]
          ? `https://www.google.com/maps?q=${d["Latitude"]},${d["Longitude"]}`
          : `https://www.google.com/maps/search/${encodeURIComponent(d["Address"] + " " + d["Pin Code"])}`;
        const key = String(d["Timestamp"]);
        const isSelected = selectedKeys.has(key);
        html += `
          <div class="dab-card${isSelected ? " selected" : ""}">
            <label class="select-chk${isSelected ? " selected" : ""}">
              <input type="checkbox" ${isSelected ? "checked" : ""} onchange="toggleSelect('${key.replace(/'/g,"\\'")}')">
              ${isSelected ? "Selected for broadcast" : "Select for broadcast"}
            </label>
            <div class="top-row">
              <div class="name">${escapeHtml(d["JioPoint Name"] || d["DAB Name"])}</div>
              <div class="type-badge">${escapeHtml(d["Activity Type"] || "")}</div>
            </div>
            <div class="meta">
              <b>DAB:</b> ${escapeHtml(d["DAB Name"])} (${escapeHtml(d["DAB PRM ID"])})<br>
              <b>Mobile:</b> ${escapeHtml(d["DAB Mobile Number"])}<br>
              <b>Address:</b> ${escapeHtml(d["Address"])}, ${escapeHtml(d["Pin Code"])}<br>
              <b>Timing:</b> ${to12Hour(d["Time From"])} – ${to12Hour(d["Time To"])}
            </div>
            <div class="actions">
              <a class="map" href="${mapsLink}" target="_blank">📍 Open Map</a>
            </div>
          </div>`;
      });
      html += `</div>`;
    });

    content.innerHTML = html;
  }

  function escapeHtml(str){
    if(!str) return "";
    return String(str).replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  function to12Hour(timeStr){
    if(!timeStr) return "";
    const parts = String(timeStr).split(":");
    if(parts.length < 2) return timeStr;
    let hours = parseInt(parts[0], 10);
    const minutes = parts[1].padStart(2, "0");
    if(isNaN(hours)) return timeStr;
    const suffix = hours >= 12 ? "PM" : "AM";
    hours = hours % 12;
    if(hours === 0) hours = 12;
    return hours + ":" + minutes + " " + suffix;
  }

  function copyWhatsAppText(){
    const selected = latestData.filter(d => selectedKeys.has(String(d["Timestamp"])));
    if(selected.length === 0){
      alert("Select at least one activity (tick 'Select for broadcast' on the entries you want) before copying.");
      return;
    }
    const grouped = {};
    selected.forEach(d => {
      const t = d["Territory"] || "Unassigned";
      if(!grouped[t]) grouped[t] = [];
      grouped[t].push(d);
    });

    let text = `🚀 *JCA-ACT × DAB | Today's DAB Activity Map*\n`;
    text += new Date().toLocaleDateString("en-IN", { weekday:"long", day:"numeric", month:"long" }) + `\n\n`;
    text += `Route every interested MNP lead to the nearest point below. FREE MNP + Instant Gift.\n\n`;

    Object.keys(grouped).sort().forEach(t => {
      const label = TERRITORY_NAMES[t] || t;
      text += `📍 *${label} (${t})*\n`;
      grouped[t].forEach(d => {
        const mapsLink = d["Latitude"] && d["Longitude"]
          ? `https://www.google.com/maps?q=${d["Latitude"]},${d["Longitude"]}`
          : "";
        text += `• ${d["JioPoint Name"]} — ${d["Address"]}, ${d["Pin Code"]}\n`;
        text += `  🕐 ${to12Hour(d["Time From"])}–${to12Hour(d["Time To"])} | ${d["Activity Type"]} | DAB: ${d["DAB Name"]} (${d["DAB Mobile Number"]})\n`;
        if(mapsLink) text += `  🗺️ ${mapsLink}\n`;
      });
      text += `\n`;
    });

    text += `🔥 No Lead Left Undelivered! Direct every customer today.`;

    navigator.clipboard.writeText(text).then(() => {
      alert("Broadcast text copied — paste directly into the JCA-ACT WhatsApp group.");
    }).catch(() => {
      prompt("Copy this text manually:", text);
    });
  }

  loadData();
</script>
<!-- date + activity-type filters wired above; DAB mobile shown in cards and broadcast text -->


</body>
</html>
